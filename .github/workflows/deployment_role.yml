name: CI & Terraform Security Gate

on:
  push:
    branches: [ main, master, feature/* ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-test:
    name: Code & IaC Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters & test tools
        run: |
          pip install ruff pytest bandit

      - name: Python Code Quality (Ruff)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Python SAST & Unit Tests
        run: |
          export PYTHONPATH=src
          pytest tests/ -v
          bandit -r src/ -ll

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Format & Syntax Check
        run: |
          cd architecture/terraform
          terraform fmt -check -recursive
